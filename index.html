<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">

<title>MateU</title>
<style>
:root{--navy:#2B3D57;--teal:#4C7FE3;--mint:#DCE6FF;--warm:#F6F8FF;--gray:#EBEEF8;--ink:#2B3D57;--mute:#66748B;--red:#B04A4A}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--navy);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#app{max-width:440px;height:100%;margin:auto;background:var(--warm);display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top)}
#main{flex:1;overflow-y:auto;padding:20px 20px 24px}
h1{font-size:26px;line-height:1.2;color:var(--navy);margin-bottom:6px}
h2{font-size:18px;color:var(--navy);margin:20px 0 10px}
p{line-height:1.5}.mute{color:var(--mute);font-size:14px}
.btn{width:100%;background:var(--navy);color:#fff;font-weight:700;padding:15px;border-radius:16px;margin-top:14px}
.btn.teal{background:var(--teal)}.btn.ghost{background:var(--gray);color:var(--navy)}
.card{background:#fff;border:1px solid var(--gray);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:20px;margin-top:14px}
.hero p{color:var(--mint);margin:4px 0 14px;font-size:14px}
.hero .btn{width:auto;margin:0;padding:11px 20px;background:var(--teal);border-radius:999px}
.row{display:flex;gap:10px;align-items:center}
.moods{display:flex;gap:8px}.moods button{flex:1;aspect-ratio:1;border-radius:50%;background:var(--gray);font-size:22px}
.moods button.on{background:var(--teal)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:8px 14px;border-radius:999px;background:var(--gray);font-size:14px;font-weight:600;color:var(--navy)}
.chip.on{background:var(--mint)}
.av{width:52px;height:52px;border-radius:50%;background:var(--teal);flex:none;color:#fff;display:grid;place-items:center;font-weight:700}
.av.big{width:84px;height:84px;font-size:28px;margin:0 auto 10px}
.price{color:var(--teal);font-weight:700}
.pro{display:flex;gap:12px;align-items:center}.pro .grow{flex:1}.pro b{color:var(--navy)}
.pro .btn{width:auto;margin:0;padding:9px 16px;border-radius:999px;font-size:14px}
.bub{max-width:82%;padding:11px 14px;border-radius:16px;margin-bottom:10px;line-height:1.45;font-size:15px}
.ai{background:var(--gray)}.me{background:var(--teal);color:#fff;margin-left:auto}
.sos{background:#F3E3E3;border:1px solid var(--red);color:#5A2A2A}
.inputbar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--gray);background:#fff}
.inputbar input{flex:1;padding:12px 14px;border:2px solid var(--gray);border-radius:14px;font:inherit}
.inputbar button{width:48px;border-radius:14px;background:var(--navy);color:#fff;font-size:18px}
nav{display:flex;background:#fff;border-top:1px solid var(--gray);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;font-size:13px;color:var(--mute);font-weight:600}
nav button.on{color:var(--navy);box-shadow:inset 0 3px 0 var(--teal)}
.dates{display:flex;gap:8px}.dates button,.times button{background:var(--gray);border-radius:14px;padding:10px 4px;flex:1;font-weight:600;font-size:13px;color:var(--navy)}
.dates button.on{background:var(--navy);color:#fff}.times button.on{background:var(--mint)}
.times{display:flex;gap:8px}
.sum{background:var(--gray);border-radius:14px;padding:14px;margin-top:16px;line-height:1.8}
.sum div{display:flex;justify-content:space-between}
.art{background:var(--gray);border-radius:14px;padding:16px;margin-top:16px;font-weight:600;color:var(--navy)}
.ill{background:var(--gray);border-radius:16px;height:190px;display:grid;place-items:center;margin:40px 0 24px}
.ill i{width:88px;height:88px;border-radius:50%;background:var(--mint)}
.center{text-align:center}
.avbtn{background:none;padding:0;flex:none}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.on{border-color:var(--navy)}
.prev{position:sticky;top:-20px;z-index:2;background:var(--warm);padding:4px 0}
.inputbar .micb{background:var(--gray);font-size:20px}
.inputbar .micb.rec{background:var(--red)}
#top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--gray)}
#top img{height:28px;width:auto}
.hero{background:linear-gradient(135deg,#4C7FE3,#8B6FE0)}
.hero p{color:#fff}
.hero .btn{background:#fff;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.svc{background:#fff;border:1px solid var(--gray);border-radius:16px;padding:14px;text-align:left;font-weight:700;color:var(--navy);font-size:14px}
.svc span{display:block;font-size:24px;margin-bottom:4px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--navy)}
.badge.off{background:#EBDDFB}
.stat{flex:1;background:#fff;border:1px solid var(--gray);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mute)}
.stat b{display:block;font-size:17px;color:var(--navy);margin-bottom:2px}
.txt{width:100%;padding:12px 14px;border:2px solid var(--gray);border-radius:14px;font:inherit;background:#fff}
</style>

V.pay=function(){var p=S.p;return'<h1>Pembayaran</h1><div class="sum"><b>'+esc(p.profiles.full_name)+'</b><div class="mute" style="font-size:14px">'+fmt(days()[S.date])+' • '+S.slot+' • '+(S.mode=="offline"?"Kunjungan offline":"Online")+'</div><div><span>Konsultasi</span><span>'+rp(p.price)+'</span></div><div><span>Biaya layanan MateU</span><span>'+rp(10000)+'</span></div><div><b>Total</b><b>'+rp(p.price+10000)+'</b></div></div><button class="btn" '+(S.busy?"disabled":"")+' onclick="pay()">'+(S.busy?"Memproses…":(DEMO?"Bayar (uji coba)":"Bayar sekarang"))+'</button><p class="mute center" style="margin-top:10px">'+(DEMO?"Mode uji coba: tidak ada uang sungguhan yang diproses.":"Pilih QRIS, transfer, atau e-wallet di jendela pembayaran berikutnya.")+'</p>'};
V.done=function(){return'<div class="center" style="margin-top:50px"><div class="av big">✓</div><h1>Pembayaran dikonfirmasi</h1><p class="mute">'+(DEMO?"Sesimu sudah aktif di menu Sesi.":"Sesimu akan muncul di menu Sesi begitu pembayaran terverifikasi, biasanya hanya beberapa detik.")+'</p></div><button class="btn" onclick="go(\'sess\')">Lihat Sesi Saya</button>'};
V.sess=function(){return'<h1>Sesi saya</h1>'+(S.bks.length?S.bks.slice().reverse().map(function(b){return card(b)}).join(""):'<p class="mute">Belum ada sesi. Cari psikolog untuk memulai.</p>')};
V.room=function(){var b=S.bk,L=S.msgs[b.id]||[],on=b.mode=="online"&&b.status=="paid";
 $("bar").innerHTML='<div class="inputbar"><input id="rin" placeholder="Tulis pesan..." aria-label="Tulis pesan" onkeydown="if(event.key==\'Enter\')sendMsg()"><button aria-label="Kirim" onclick="sendMsg()">➜</button></div>';
 return'<div class="row" style="margin-bottom:12px"><button class="avbtn" aria-label="Kembali" style="font-size:26px" onclick="go(\''+(S.me.role=="psi"?"phome":"sess")+'\')">‹</button><div class="av">'+ini(other(b))+'</div><div style="flex:1"><b>'+esc(other(b))+'</b><div class="mute" style="font-size:13px">'+dl(b)+' • '+b.slot+' • '+(b.mode=="offline"?"Kunjungan offline":"Online")+'</div></div>'+(on?'<button class="chip on" onclick="callRoom(\''+b.id+'\')">📹 VC</button>':'')+'</div>'
 +(L.length?'':'<p class="mute center">Belum ada pesan. Mulai percakapan.</p>')+L.map(function(c){return'<div class="bub '+(c.sender_id==S.me.id?"me":"ai")+'">'+esc(c.body)+'</div>'}).join("")};
V.vc=function(){return'<div style="color:#fff"><div class="row" style="margin-bottom:10px"><b style="flex:1">'+esc(other(S.bk))+'</b><a class="chip" style="text-decoration:none" target="_blank" rel="noopener" href="https://meet.jit.si/mateu-'+S.bk.id+'">Buka di tab baru</a><button class="chip" style="background:#C45B5B;color:#fff" onclick="endCall()">Akhiri</button></div><div id="jt" style="height:70vh;border-radius:16px;overflow:hidden;background:#0E1A30"></div></div>'};
V.phome=function(){var up=S.bks.filter(function(b){return b.status=="paid"}),td=iso(new Date()),i=inc();
 return'<h1>Halo, '+esc(S.me.full_name)+'</h1>'+(S.pf&&!S.pf.verified?'<div class="card sos">Akunmu menunggu verifikasi admin MateU. Setelah terverifikasi, profilmu tampil ke pelanggan.</div>':'')
 +'<div class="row" style="margin-top:12px"><div class="stat"><b>'+up.filter(function(b){return b.day==td}).length+'</b>Hari ini</div><div class="stat"><b>'+up.length+'</b>Akan datang</div><div class="stat"><b style="font-size:14px">'+rp(i.n)+'</b>Bersih bulan ini</div></div>'
 +'<button class="btn '+(S.pf&&S.pf.available?"teal":"ghost")+'" onclick="togAvail()">Status: '+(S.pf&&S.pf.available?"Tersedia":"Tidak tersedia")+'</button><h2>Jadwal dan booking</h2>'
 +(up.length?up.map(function(b){return card(b,'<button class="chip" onclick="finish(\''+b.id+'\')">Tandai selesai</button>')}).join(""):'<p class="mute">Belum ada booking terkonfirmasi.</p>')};
V.pinc=function(){var i=inc(),mo=iso(new Date()).slice(0,7),L=S.bks.filter(function(b){return b.status=="done"&&b.day.slice(0,7)==mo});
 return'<h1>Pendapatan</h1><div class="hero"><p style="margin:0">Penghasilan bersih bulan ini</p><b style="font-size:30px">'+rp(i.n)+'</b><p style="margin:4px 0 0">dari '+L.length+' sesi selesai</p></div><div class="sum"><div><span>Total tarif sesi</span><span>'+rp(i.g)+'</span></div><div><span>Potongan MateU 15%</span><span>-'+rp(i.f)+'</span></div><div><b>Bersih</b><b>'+rp(i.n)+'</b></div></div><h2>Riwayat transaksi</h2>'
 +(L.length?L.slice().reverse().map(function(b){var c=Math.round(b.price*b.commission_pct/100);return'<div class="card"><div class="row"><b style="flex:1">'+dl(b)+' • '+esc(other(b))+'</b><span>'+rp(b.price)+'</span></div><div class="mute" style="font-size:13px">Potongan '+rp(c)+' • bersih '+rp(b.price-c)+'</div></div>'}).join(""):'<p class="mute">Belum ada sesi selesai bulan ini. Tandai sesi selesai di menu Jadwal.</p>')
 +'<p class="mute">Potongan 15% otomatis. Biaya layanan Rp10.000 dibayar pelanggan, bukan dipotong dari tarifmu.</p>'};
V.me=function(){var psi=S.me.role=="psi",bs=S.bks,ml=["Sangat buruk","Kurang baik","Biasa saja","Baik","Sangat baik"],ok=S.ok?'<p class="mute center" style="margin-top:8px">Tersimpan ✓</p>':'';
 var h='<div class="card center" style="padding:20px">'+avs(S.av,110)+'<h1 style="font-size:22px;margin-top:6px">'+esc(psi?S.me.full_name:S.me.nickname)+'</h1><span class="badge">'+(psi?(S.pf&&S.pf.verified?"Psikolog • Terverifikasi":"Psikolog • Menunggu verifikasi"):"Pelanggan")+'</span><p class="mute">'+esc(S.email)+'</p><button class="btn ghost" onclick="go(\'avatar\')">Ubah avatar</button></div>';
 if(psi){var p=S.pf||{};h+='<h2>Profil layanan</h2><select id="pt" class="txt" aria-label="Profesi" style="margin-bottom:8px">'+["Psikolog Klinis","Psikiater"].map(function(x){return'<option'+(p.title==x?" selected":"")+'>'+x+'</option>'}).join("")+'</select><input id="py" type="number" class="txt" placeholder="Tahun pengalaman" aria-label="Tahun pengalaman" value="'+esc(p.years)+'" style="margin-bottom:8px"><input id="pp" type="number" class="txt" placeholder="Tarif per sesi (Rp)" aria-label="Tarif per sesi" value="'+esc(p.price)+'" style="margin-bottom:8px"><input id="pe" class="txt" placeholder="Pendidikan" aria-label="Pendidikan" value="'+esc(p.edu)+'" style="margin-bottom:8px"><textarea id="pa" class="txt" rows="4" placeholder="Tentang layanan" aria-label="Tentang layanan">'+esc(p.about)+'</textarea><button class="btn" onclick="savePf()">Simpan profil</button>'+ok}
 else h+='<h2>Nama panggilan</h2><input id="nk" class="txt" maxlength="30" aria-label="Nama panggilan" value="'+esc(S.me.nickname)+'"><button class="btn" onclick="saveNick()">Simpan nama</button>'+ok+'<div class="row" style="margin-top:14px"><div class="stat"><b>'+bs.length+'</b>Sesi</div><div class="stat"><b>'+(S.mood!==null?ml[S.mood]:"-")+'</b>Suasana hati</div></div>';
 return h+'<button class="btn ghost" style="margin-top:20px" onclick="logout()">Keluar</button>'};
V.avatar=function(){return'<div class="prev center">'+avs(S.av,130)+'</div><h2>Kepala</h2>'+chips("head",HEADS)+'<h2>Wajah</h2>'+chips("face",FACES)+'<h2>Ukuran badan</h2>'+chips("size",SIZES)+'<h2>Warna kulit atau bulu</h2>'+sws("skin",SKIN,"Warna kulit")+'<h2>Baju</h2>'+sws("cloth",CLOTH,"Warna baju")+(S.av.head=="manusia"?'<h2>Rambut</h2>'+sws("hair",HAIR,"Warna rambut"):"")+'<h2>Aksesori</h2>'+chips("acc",ACCS)+'<button class="btn ghost" onclick="acak()">Acak</button><button class="btn" onclick="go(\'me\')">Selesai</button>'};
function draw(){
 var m=$("main"),nav=$("nav"),tp=$("top"),sc=S.scr,psi=S.me&&S.me.role=="psi";
 $("bar").innerHTML="";m.style.background=sc=="vc"?"#1A2742":"";
 var hide=["boot","auth","vc"].indexOf(sc)>-1;
 var tabs=psi?[["phome","Jadwal"],["pinc","Pendapatan"],["me","Profil"]]:[["home","Beranda"],["chat","AI"],["find","Cari"],["sess","Sesi"],["me","Profil"]];
 var tab={rec:"chat",prof:"find",book:"find",pay:"find",done:"sess",room:psi?"phome":"sess",avatar:"me"}[sc]||sc;
 nav.style.display=hide?"none":"flex";tp.style.display=hide?"none":"flex";
 nav.innerHTML=tabs.map(function(t){return'<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
 tp.innerHTML='<img src="'+WM+'" alt="MateU"><button class="chip" onclick="go(\'me\')">'+(S.me?esc(psi?"Psikolog":S.me.nickname):"")+'</button>';
 m.innerHTML=(V[sc]||V.boot)();
 if(sc=="chat"||sc=="room")m.scrollTop=m.scrollHeight;
 if(sc=="vc")vcInit();
}
draw();boot();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});

</script>
